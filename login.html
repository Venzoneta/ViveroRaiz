<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Vivero Raíz</title>
    <link rel="stylesheet" href="./styles/login-styles.css">
    <script src="./components/scripts/sesion.js" defer></script>
    <script src="./components/scripts/validaciones.js" defer></script>
</head>
<body class="pagina-autenticacion">
    <main class="auth-card">
        <aside class="auth-panel-lateral">
            <a href="./index.html"><img src="./components/images/logo-vivero-raiz.png" alt="Logo de Vivero Raíz" class="auth-logo"></a>
            <h1>Vivero Raiz.</h1>
        </aside>
        <section class="auth-panel-formulario">
            <form id="form-login" novalidate>
                <h2>Ingresar</h2>                <p class="mensaje-formulario" role="status" hidden></p>
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" placeholder="mail@mail.com" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Ingresar</button>
                <div class="enlaces-auth"><a href="#">¿Olvidaste tu contraseña?</a><a href="./registro.html">Registrate</a></div>
            </form>
        </section>
    </main>
    <footer class="footer-vivero">
        <div><strong>Vivero Raíz</strong><p>Avenida la Plata 1701,Boedo, Buenos Aires</p></div>
        <div><strong>Secciones</strong><p><a href="./catalogo.html">Catálogo</a> · <a href="./contacto.html">Contacto</a></p></div>
        <div><strong>Horarios</strong><p>Lunes a viernes de 09:00 a 18:30</p></div>
        <p class="copyright">© 2026 Vivero Raíz</p>
    </footer>
</body>
</html>
