<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Raiz</title>
    <script src=""></script>
    <link rel="stylesheet" href="./styles/styles.css" />
    <!-- <link rel="" href="./index.html" /> -->
</head>

<body class="pagina-registro">
    <main class="registro-contenedor">
        <form class="formulario-registro">
            <h1>Crear una cuenta</h1>

            <div class="campo-formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
            </div>

            <div class="campo-formulario">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo-formulario">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresá una contraseña" minlength="6"
                    required>
            </div>

            <div class="campo-formulario">
                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" name="confirmar-password"
                    placeholder="Repetí la contraseña" minlength="6" required>
            </div>

            <button type="submit" class="boton-enviar">
                Registrarme
            </button>

            <p class="texto-login">
                ¿Ya tenés una cuenta?
                <a href="./login.html">Iniciar sesión</a>
            </p>
        </form>
    </main>
</body>

</html>
